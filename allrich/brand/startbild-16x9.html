<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Anton";src:url(../fonts/anton-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:600;src:url(../fonts/manrope-latin-600-normal.woff2) format("woff2")}
html,body{margin:0;background:#000}
.c{position:relative;width:1920px;height:1080px;overflow:hidden;
  background:radial-gradient(circle at 50% 46%,#16264d 0%,#0b1226 32%,#06070b 62%,#030304 100%)}
.c:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 26px)}
.glow{position:absolute;left:50%;top:46%;width:820px;height:420px;margin:-210px 0 0 -410px;border-radius:50%;background:radial-gradient(closest-side,rgba(61,123,255,.30),rgba(61,123,255,0));filter:blur(10px)}
.ringX{display:none;position:absolute;left:50%;top:50%;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;border:1.5px solid rgba(120,160,255,.16);box-shadow:inset 0 0 120px rgba(61,123,255,.08)}
.logo{position:absolute;left:0;right:0;top:50%;transform:translateY(-55%);display:flex;flex-direction:column;align-items:center}
.row{display:flex;align-items:center;gap:26px}
.dot{width:36px;height:36px;margin-top:8px;border-radius:50%;background:#3d7bff;box-shadow:0 0 30px #3d7bff,0 0 90px rgba(61,123,255,.8),0 0 180px rgba(61,123,255,.45)}
.name{font-family:Anton;font-size:178px;line-height:1;letter-spacing:.03em;color:#f5f4f1;
  text-shadow:0 0 40px rgba(255,255,255,.12),0 10px 60px rgba(0,0,0,.6)}
.sub{margin-top:30px;padding-left:62px;font-family:Manrope;font-weight:600;font-size:40px;letter-spacing:.62em;margin-right:-.62em;color:#a9b4cc}
.line{position:absolute;left:50%;bottom:300px;width:260px;height:3px;margin-left:-165px;border-radius:3px;
  background:linear-gradient(90deg,transparent,#3d7bff,transparent);box-shadow:0 0 24px #3d7bff}
</style></head><body><div class="c" id="c"><div class="glow"></div>
<div class="logo"><div class="row"><i class="dot"></i><span class="name">ALLRICH</span></div><div class="sub">WEBDESIGN</div></div>
<div class="line"></div></div></body></html>
