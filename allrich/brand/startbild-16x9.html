<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Anton";src:url(../fonts/anton-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:600;src:url(../fonts/manrope-latin-600-normal.woff2) format("woff2")}
html,body{margin:0;background:#000}
.c{position:relative;width:1920px;height:1080px;overflow:hidden;
  background:radial-gradient(ellipse 70% 75% at 50% 47%,#132245 0%,#0a1330 30%,#05070e 62%,#020203 100%)}
.glow{position:absolute;left:50%;top:45%;width:1100px;height:420px;margin:-210px 0 0 -550px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(61,123,255,.26),rgba(61,123,255,.07) 60%,rgba(61,123,255,0));filter:blur(18px)}
.logo{position:absolute;left:0;right:0;top:calc(50% - 175px);display:flex;flex-direction:column;align-items:center}
.row{display:flex;align-items:center;gap:34px;margin-left:-40px}
.dot{width:42px;height:42px;margin-top:6px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#a9c4ff 0%,#4f88ff 38%,#2f6cff 70%,#2456d6 100%);
  position:relative;box-shadow:0 0 0 1px rgba(170,200,255,.35),0 0 18px 3px rgba(61,123,255,.95)}
.dot:after{content:"";position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;background:radial-gradient(closest-side,rgba(61,123,255,.55),rgba(61,123,255,.18) 40%,rgba(61,123,255,0))}
.name{font-family:Anton;font-size:236px;line-height:1;letter-spacing:.035em;
  background:linear-gradient(180deg,#ffffff 0%,#f4f2ee 48%,#d9dce3 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.35)) drop-shadow(0 18px 50px rgba(0,0,0,.55))}
.sub{margin-top:34px;margin-left:36px;font-family:Manrope;font-weight:600;font-size:46px;letter-spacing:.66em;margin-right:-.66em;color:#d3dbec}
.line{position:absolute;left:50%;top:50%;margin-top:250px;width:340px;height:3px;margin-left:-170px;border-radius:3px;
  background:linear-gradient(90deg,rgba(61,123,255,0),#5b90ff 50%,rgba(61,123,255,0));box-shadow:0 0 18px rgba(61,123,255,.9)}
</style></head><body><div class="c" id="c"><div class="glow"></div>
<div class="logo"><div class="row"><i class="dot"></i><span class="name">ALLRICH</span></div><div class="sub">WEBDESIGN</div></div>
<div class="line"></div></div></body></html>
